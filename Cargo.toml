[package]
name = "rustfetch"
version = "0.2.9"
edition = "2024"
description = "A fastfetch- and hyfetch-inspired system information tool written in Rust"
license = "MIT"

[[bin]]
name = "rustfetch"
path = "src/main.rs"

[dependencies]
libc = "0.2"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = "symbols"

# Machine-local speed profile. See docs/local-build.md and
# scripts/build-local.sh. NOT portable: the build script adds
# `-C target-cpu=native` on top of these settings.
[profile.local]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
