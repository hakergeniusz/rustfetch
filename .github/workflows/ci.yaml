name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo --locked build --all-targets
      - run: cargo --locked clippy --all-targets -- -D warnings
      - run: cargo --locked test

  generated-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo --locked build --release
      # Rebuild the generated CLI-flag tests from the binary's own --help and
      # fail if the committed file is stale (a flag was added/removed/renamed).
      - name: Verify generated CLI tests are up to date
        run: |
          python3 scripts/gen-cli-tests.py target/release/rustfetch
          git diff --exit-code -- tests/cli_flags_generated.rs

  fastfetch-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin the exact upstream reference instead of relying on whatever
      # fastfetch version the runner image happens to ship.
      - name: Download fastfetch 2.71.0 reference
        run: |
          curl -fsSL -o "$RUNNER_TEMP/fastfetch.tar.gz" \
            https://github.com/fastfetch-cli/fastfetch/releases/download/2.71.0/fastfetch-linux-amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/fastfetch.tar.gz" -C "$RUNNER_TEMP"
          REF="$RUNNER_TEMP/fastfetch-linux-amd64/usr/bin/fastfetch"
          test "$("$REF" --version-raw)" = "2.71.0"

      - name: Byte-for-byte parity tests
        env:
          RUSTFETCH_FASTFETCH: ${{ runner.temp }}/fastfetch-linux-amd64/usr/bin/fastfetch
        run: cargo --locked test --test fastfetch_parity -- --nocapture

      # Distro fixtures mount a tmpfs over /etc in a private namespace. GitHub
      # runners block unprivileged user namespaces, so run only those tests as
      # root; the main suite above still runs unprivileged.
      - name: Distro identity parity (privileged namespace)
        env:
          RUSTFETCH_FASTFETCH: ${{ runner.temp }}/fastfetch-linux-amd64/usr/bin/fastfetch
        run: |
          BIN=$(cargo --locked test --no-run --test fastfetch_parity --message-format=json \
            | python3 -c 'import json,sys; print(next(m["executable"] for m in (json.loads(l) for l in sys.stdin if l.startswith("{")) if m.get("profile",{}).get("test") and m.get("target",{}).get("name")=="fastfetch_parity"))')
          test -n "$BIN"
          sudo env RUSTFETCH_FASTFETCH="$RUSTFETCH_FASTFETCH" "$BIN" --nocapture distro::
