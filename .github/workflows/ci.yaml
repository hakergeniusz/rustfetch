name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo --locked build --all-targets
      - run: cargo --locked clippy --all-targets -- -D warnings
      - run: cargo --locked test
