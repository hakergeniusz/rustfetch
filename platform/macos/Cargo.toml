[package]
name = "rustfetch"
version = "0.2.7"
edition = "2024"
description = "A fastfetch- and hyfetch-inspired system information tool — native macOS build"
license = "MIT"

[[bin]]
name = "rustfetch"
path = "src/main.rs"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = "symbols"
